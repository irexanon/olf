plugins { id 'com.android.application' }

android {
    namespace 'com.launcher.positionfixer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.launcher.positionfixer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with debug keystore so the APK is installable without a custom keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly files('libs/xposed-api-82.jar')
}
